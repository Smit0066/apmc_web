  const b=data.bills.find(x=>x.billNo===f.dataset.id),amt=Number(v.amount),balance=b?b.gross-(b.buyerPurchasePaid||0):0;if(!b||amt<=0||amt>balance+.001||!v.ref.trim()){toast("Trader collection amount / reference તપાસો.","error");return}
  b.buyerPurchasePaid=Number(((b.buyerPurchasePaid||0)+amt).toFixed(2));b.buyerPurchaseRef=v.ref;b.buyerPurchaseMode=v.mode;addAudit("વેપારી ખરીદ ચુકવણી નોંધાઈ · "+money(amt),b.billNo);persist();closeSheet();navigate("payments");selectedLedger="trader";page();toast("Trader collection record થઈ");return;
 }
 if(f.id==="complaintForm"){
  const c={id:"CMP-26-"+String(data.nextComplaint++).padStart(5,"0"),lotId:v.lotId,type:v.type,by:v.by,details:v.details,status:"open",date:today()};data.complaints.unshift(c);addAudit("નવી ફરિયાદ નોંધાઈ",c.id);persist();closeSheet();navigate("disputes");toast("ફરિયાદ નોંધાઈ · "+c.id);return;
 }
 if(f.id==="termsForm"){
  data.terms={farmerPaymentDays:Number(v.farmerPaymentDays),dispatchDays:Number(v.dispatchDays),defaultBuyerCreditDays:Number(v.defaultBuyerCreditDays)};addAudit("Deadline policy update થઈ","SETTINGS");persist();closeSheet();page();toast("Deadline rules સાચવાયા");return;
 }
 if(f.id==="buyerForm"){
  const old=f.dataset.old||"",name=v.name.trim();if(!name||!v.registrationNo.trim()){toast("વેપારીનું નામ અને registration જરૂરી છે.","error");return}
  if(!old&&data.buyers.includes(name)){toast("વેપારી પહેલેથી હાજર છે.","error");return}
  if(old&&old!==name){data.buyers=data.buyers.map(x=>x===old?name:x);data.bills.forEach(b=>{if(b.buyer===old)b.buyer=name});data.lots.forEach(l=>{if(l.buyer===old)l.buyer=name})}
  if(!old)data.buyers.push(name);data.buyerProfiles[name]={registrationNo:v.registrationNo,creditDays:Number(v.creditDays),purchaseLimit:Number(v.purchaseLimit||0)};addAudit("Trader master update","TRADER:"+name);persist();closeSheet();page();toast("વેપારી master સાચવાયું");return;
 }
 if(f.id==="commodityForm"){const name=v.name.trim();if(name&&!data.commodities.includes(name))data.commodities.push(name);persist();closeSheet();page();toast("Commodity master update થયું")}
}

 const l=data.lots.find(x=>x.id===id),b=data.bills.find(x=>x.billNo===id),c=data.complaints.find(x=>x.id===id),t=data.tickets.find(x=>x.ticketNo===id);
 if(name==="back"){closeSheet();return}

 if(name==="new-entry"){newEntry();return}
 if(name==="new-auction"){auctionForm();return}

 if(name==="weigh-lot"){weighForm(id);return}
 if(name==="bill-view"){billDetail(id);return}

 if(name==="trader-pay"){traderPayForm(id);return}
 if(name==="complaint-add"){complaintForm();return}
 if(name==="complaint-view"){showComplaint(id);return}
 if(name==="resolve-complaint"){if(c){c.status="resolved";addAudit("ફરિયાદ ઉકેલાઈ",id);persist();closeSheet();navigate("disputes");toast("ફરિયાદ resolved થઈ")}return}
 if(name==="create-pass"){createPass(id);return}
 if(name==="dispatch"){dispatchLot(id);return}
 if(name==="edit-terms"){termsForm();return}
 if(name==="edit-buyer"){buyerForm(id);return}
 if(name==="buyer-add"){buyerForm();return}
 if(name==="yard-picker"){yardPicker();return}
 if(name==="role-picker"){rolePicker();return}
 if(name==="select-yard"){data.yard=id;persist();closeSheet();page();toast("Demo yard બદલાયું");return}
 if(name==="select-role"){data.role=id;persist();closeSheet();page();toast("Demo role બદલાયો");return}
 if(name==="global-search"){showSearch();return}
 if(name==="notifications"){notifyPage();return}
 if(name==="export-report"){exportCsv($("#reportType").value);return}
 if(name==="export-audit"){exportCsv("audit");return}
 if(name==="print-ticket"){const x=data.tickets.find(z=>z.ticketNo===id);if(x){const w=window.open("","_blank");if(!w){toast("Print માટે popup allow કરો.","error");return}w.document.write("<html><head><title>"+esc(x.ticketNo)+"</title><meta charset='utf-8'><style>body{font-family:Arial,sans-serif;padding:20px}h2{text-align:center}.box{border:1px dashed #888;padding:16px;max-width:430px;margin:auto;line-height:1.8}</style></head><body><div class='box'><h2>APMC · હરાજી ભાવ-કાપલી</h2>"+ticketHtml(x)+"</div><script>onload=()=>print()<\/script></body></html>");w.document.close()}return}
 if(name==="share-ticket"){const x=data.tickets.find(z=>z.ticketNo===id);if(x&&navigator.share)navigator.share({title:x.ticketNo,text:"APMC auction ticket "+x.ticketNo+" · Lot "+x.lotId}).catch(()=>{});else if(x){navigator.clipboard?.writeText("APMC auction ticket "+x.ticketNo+" · Lot "+x.lotId);toast("Ticket reference copy કરવાનો પ્રયાસ કર્યો")}return}
 if(name==="global-search-run")return;
 if(name==="close-sheet"){closeSheet();return}
 if(name==="buyer-edit"){buyerForm(id);return}
 if(name==="terms-edit"){termsForm();return}
 if(name==="role-switch"){rolePicker();return}
 if(name==="commodity-add"){if(!access("settings"))return;openSheet("Commodity ઉમેરો",'<form id="commodityForm">'+formField("Commodity name","name","text","",true)+'<button class="primary full" type="submit">પાક ઉમેરો</button></form>');return}
 if(name==="switchyard"){yardPicker();return}
 if(name==="global-search-focus"){showSearch();return}
 if(name==="export-lots"){exportCsv("lots");return}
 if(name==="buyer-detail"){navigate("buyerledger");return}
 if(name==="edit-lot"&&l){toast("આ prototypeમાં Lot ID immutable છે; correction માટે supervisor workflow productionમાં ઉમેરાશે.");return}
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.route){navigate(b.dataset.route);return}
 if(b.dataset.filter){lotFilter=b.dataset.filter;page();return}
 if(b.dataset.ledger){selectedLedger=b.dataset.ledger;page();return}
 if(b.dataset.action){act(b.dataset.action,b.dataset.id||"");return}
});
document.addEventListener("input",e=>{
 if(e.target.id==="lotSearch"){lotSearch=e.target.value;const pos=e.target.selectionStart;const list=data.lots.filter(l=>(lotFilter==="all"||l.status===lotFilter)&&(!lotSearch||[l.id,l.farmer,l.commodity,l.vehicle,l.mobile].join(" ").toLowerCase().includes(lotSearch.toLowerCase())));const existing=$("#lotList");if(existing)existing.innerHTML=list.map(lotRow).join("")||empty("કોઈ Lot મળ્યો નથી")}
 if(e.target.id==="globalQuery"){const r=$("#globalResults");if(r)r.innerHTML=searchResults(e.target.value)}
});
document.addEventListener("change",e=>{
 if(e.target.id==="sellerType"){const trader=e.target.value==="trader";$("#farmerFields").classList.toggle("hide",trader);$("#traderFields").classList.toggle("hide",!trader);const tr=$("#traderFields input");if(tr)tr.required=trader}
});
document.addEventListener("submit",e=>{const f=e.target;if(f.matches("form[id]")&&["entryForm","auctionForm","weighForm","farmerPayForm","traderPayForm","complaintForm","termsForm","buyerForm","commodityForm"].includes(f.id))handleForm(e)});
document.addEventListener("click",e=>{if(e.target.id==="modal")closeSheet()});
$("#bottomNav").addEventListener("click",()=>{});page();persist();
})();
